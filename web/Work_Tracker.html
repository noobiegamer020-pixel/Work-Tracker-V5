<style>

.pr{border:0;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;color:#fff}
.p1{background:var(--hi)}.p2{background:var(--md)}.p3{background:var(--lo)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:4px 8px}
.add{display:flex;gap:8px;margin-top:10px}

.wk{display:flex;gap:8px;align-items:flex-end;height:96px}

.wk .sel .b i{opacity:1}

.wk .sel small{color:var(--ink);font-weight:800}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.empty{color:var(--mute);padding:6px 0}
.r2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:4px}
.seg{display:flex;gap:6px;margin-top:12px}

.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tr{margin-top:12px}.st{font-size:13px;color:var(--mute);white-space:nowrap}.tr.hit .st{color:var(--ac);font-weight:800}
.add input[type=number]{flex:1}
:root{--new:#1E9E5A;--old:#E8820C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--new:#3FD08A;--old:#F5A04A}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;text-align:left;line-height:1.2;color:var(--ink)}

#app{padding-bottom:96px}
body[data-tab=plan] .card:not([data-t=p]),body[data-tab=sales] .card:not([data-t=s]),body[data-tab=clients] .card:not([data-t=c]){display:none}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

.tabs button span{font-size:18px}
.tabs .on{background:var(--ac2);color:var(--ac)}
.add select{flex:1;min-width:0}
:root{--pot:#7B5CE0}

.tgt{background:var(--ac2);border-radius:12px;padding:10px;margin-bottom:6px}
textarea{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px}
.chip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.acc summary .gn{margin-left:0;background:none;padding:0;font-size:inherit;color:inherit;flex:1;min-width:0}
.ol{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--ln);font-size:13px}
.ol b{margin-left:auto}
.ol input{flex:1;min-width:0}
.g>.og{flex:1 1 100%;margin:0}
.acc .ol .x{margin-left:0}
.tg{font-size:10px;font-weight:800;color:var(--ac);background:var(--ac2);border-radius:6px;padding:1px 6px}
.il{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);margin-top:8px}
.il select,.il input[type=text]{width:100%}
:root{--hg:linear-gradient(135deg,#0B8A7E 0%,#2563EB 100%);--sh:0 6px 22px rgba(18,36,43,.09)}

.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--ln);border-radius:26px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.3);background:var(--sf)}

select[data-enh]{display:none}
.dd{position:relative;min-width:0}

.ctl{align-items:flex-start}

.hero{flex-wrap:wrap}

.ddb.ps{width:auto;color:#fff;border:0;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:800}

.ddb.open:not(.ps){border-color:var(--ac)}
.ddl{margin-top:6px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;max-height:220px;overflow:auto;padding:4px}

.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;margin:0;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.38);transition:opacity .16s ease,transform .2s cubic-bezier(.2,.8,.2,1),visibility 0s .2s}

@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}}

@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.22)}100%{transform:scale(1)}}

.card.in{animation:rise .42s cubic-bezier(.2,.8,.2,1) backwards}
.card.inl{animation:fadein .22s ease backwards}
body.tabanim .bar i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards}

.tind{width:25%}

  <div class="sub" style="margin-top:8px;${pend?'color:var(--hi);font-weight:700':''}">${pend?'⚠ Check due: compare with the odometer, then tap "Counter is right" or type the odometer.':'Next check: '+dm(oilNext())}</div>

  :`<div class="sub" style="margin-top:10px">The "Oil changed" option appears on ${dm(oilFrom())}, 15 days after the start, or earlier when the counter reaches ${fmt(T)} km.</div>`}
  <div class="add" style="margin-top:8px"><button class="btn ghost" data-oil="edit">Fix the start date or odometer</button></div>

document.addEventListener('click',e=>{const b=e.target.closest('[data-oil]');if(!b)return;const a=b.dataset.oil,td=key(mk()),num=id=>+((($('#'+id))||{}).value);
 if(a=='start'){const d=(($('#oil-d')||{}).value)||td,od=num('oil-o'),nx=num('oil-x');

 else if(a=='ok'&&S.oil){S.oil.chk=td;save();oilSchedule();toast('Checked. Next reminder in a week')}

 else if(a=='savenext'&&S.oil){const v=num('oil-x'),o=S.oil;if(!(v>0)){toast('Type the odometer of the next oil change');return}if(o.odo==null){toast('Type the odometer first (Correct)');return}if(v<=o.odo){toast('It must be above the odometer at the last change');return}o.next=v;save();carPush(1);toast('Next oil change saved')}
 else if(a=='change'&&S.oil){const cs=($('#oil-c')||{}).value;if(cs===''||cs==null||!(+cs>=0)){toast('Type the cost (0 if none)');return}
  const o=S.oil,od2=num('oil-o2'),est=oilOdo(),odo=od2>0?od2:est;oilToFees(+cs);S.oilLog=(S.oilLog||[]).concat([{date:td,odo:odo,cost:+cs}]).slice(-20);
  S.oil={date:td,t:Date.now(),km:0,odo:odo,next:odo!=null?odo+OILKM:null,chk:''};save();carPush(1);oilSchedule();toast(+cs>0?'Oil change saved in Trans/Taxi':'Oil change saved')}
 else if(a=='edit'){if(b.dataset.s!='1'){b.dataset.s='1';b.textContent='Tap again to start over';setTimeout(()=>{b.dataset.s='';b.textContent='Fix the start date or odometer'},3000);return}S.oil=null;save();carPush(1);oilSchedule()}
 render()});
